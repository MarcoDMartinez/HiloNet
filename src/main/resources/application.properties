# Configuración de HiloNet
# Aplicación de Gestión Textil

# Servidor
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8

# Aplicación
app.name=HiloNet
app.version=1.0.0
app.description=Sistema de Gestión Textil

# Autenticación
auth.session.timeout=3600
auth.password.min-length=8
auth.password.require-uppercase=true
auth.password.require-numbers=true

# Base de Datos (futuro)
# db.driver=
# db.url=
# db.user=
# db.password=

# Logging
logging.level=INFO
logging.file=logs/hilonet.log
